<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus voos · DelayTrack</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M9 34 C 18 33, 28 26, 40 9' fill='none' stroke='%23F2A93B' stroke-width='6' stroke-linecap='round'/%3E%3Ccircle cx='9' cy='34' r='5' fill='%230E3B43'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="publico.css">
</head>
<body>
  <header class="topo-pax">
    <div class="topo-pax-dentro">
      <span class="marca">
        <span data-marca></span>
        <span class="marca-nome">Azul - DelayTrack</span>
      </span>
      <button class="link" id="btn-sair">Sair</button>
    </div>
  </header>

  <main class="pax">
    <h1 id="saudacao">Olá</h1>
    <p class="apoio" id="horario">Carregando seus voos...</p>

    <div id="voos" class="voos" aria-live="polite"></div>

    <form class="acompanhar" id="form-acompanhar">
      <h2>Acompanhar outro voo</h2>
      <div class="erro" hidden></div>
      <div class="acompanhar-linha">
        <label class="campo">
          <span>Número do voo</span>
          <input name="numero" placeholder="Ex.: AD4102" autocomplete="off" required>
        </label>
        <button class="botao" type="submit">Acompanhar</button>
      </div>
      <small>O número está no seu cartão de embarque.</small>
    </form>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="sessao.js"></script>
  <script src="passageiro.js"></script>
</body>
</html>
